<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DogCEO Explorer | אנציקלופדיית גזעי הכלבים</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-dark: #0b1120;
        --bg-card: rgba(30, 41, 59, 0.75);
        --bg-card-hover: rgba(51, 65, 85, 0.9);
        --accent: #38bdf8;
        --accent-secondary: #818cf8;
        --accent-pink: #f472b6;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: rgba(255, 255, 255, 0.12);
        --radius-lg: 20px;
        --radius-md: 14px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Heebo', sans-serif !important;
        background: radial-gradient(circle at top right, #1e1b4b, #0b1120 55%, #090d16) !important;
        background-attachment: fixed !important;
        color: var(--text-main) !important;
        line-height: 1.6;
        min-height: 100vh;
        direction: rtl;
      }

      .app-wrapper {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .main-content {
        flex: 1;
        max-width: 1280px;
        width: 100%;
        margin: 0 auto;
        padding: 2.5rem 1.5rem;
      }

      /* Navbar */
      .navbar {
        background: rgba(11, 17, 32, 0.85);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--border-color);
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
      }

      .navbar-container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 1rem 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .navbar-brand {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        text-decoration: none;
        color: var(--text-main);
      }

      .brand-icon {
        font-size: 2.2rem;
        filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.5));
      }

      .brand-text {
        display: flex;
        flex-direction: column;
        line-height: 1.1;
      }

      .brand-title {
        font-weight: 900;
        font-size: 1.4rem;
        background: linear-gradient(135deg, #38bdf8, #818cf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .brand-subtitle {
        font-size: 0.78rem;
        color: var(--text-muted);
        letter-spacing: 0.5px;
      }

      .navbar-links {
        display: flex;
        gap: 0.85rem;
      }

      .nav-item {
        text-decoration: none;
        color: var(--text-muted);
        font-weight: 600;
        padding: 0.6rem 1.25rem;
        border-radius: 999px;
        transition: all 0.25s ease;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        border: 1px solid transparent;
      }

      .nav-item:hover {
        color: var(--text-main);
        background: rgba(255, 255, 255, 0.06);
        border-color: var(--border-color);
      }

      .nav-item.active {
        color: #0b1120;
        background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
        font-weight: 800;
        box-shadow: 0 4px 18px rgba(56, 189, 248, 0.4);
      }

      .nav-badge {
        background: rgba(11, 17, 32, 0.3);
        color: #0b1120;
        padding: 0.1rem 0.55rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 800;
      }

      /* Hero Section */
      .hero-section {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 3.5rem;
        align-items: center;
        padding: 3rem 0;
      }

      .hero-pill {
        display: inline-block;
        background: rgba(56, 189, 248, 0.15);
        color: var(--accent);
        padding: 0.45rem 1.2rem;
        border-radius: 999px;
        font-size: 0.92rem;
        font-weight: 700;
        margin-bottom: 1.5rem;
        border: 1px solid rgba(56, 189, 248, 0.35);
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
      }

      .hero-title {
        font-size: 3.4rem;
        font-weight: 900;
        line-height: 1.15;
        margin-bottom: 1.25rem;
      }

      .gradient-text {
        background: linear-gradient(135deg, #38bdf8, #818cf8, #f472b6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .hero-description {
        font-size: 1.18rem;
        color: var(--text-muted);
        margin-bottom: 2.2rem;
        max-width: 620px;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
        color: #0b1120;
        border: none;
        padding: 1rem 2rem;
        border-radius: 999px;
        font-size: 1.12rem;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.25s ease;
        font-family: inherit;
        box-shadow: 0 8px 25px rgba(56, 189, 248, 0.35);
      }

      .btn-primary:hover {
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 14px 32px rgba(56, 189, 248, 0.5);
      }

      .btn-secondary {
        background: var(--bg-card);
        color: var(--text-main);
        border: 1px solid var(--border-color);
        padding: 0.65rem 1.4rem;
        border-radius: 999px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        font-family: inherit;
        transition: all 0.2s ease;
      }

      .btn-secondary:hover {
        background: var(--bg-card-hover);
        border-color: var(--accent);
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.2rem;
        margin-top: 2.8rem;
      }

      .stat-card {
        background: var(--bg-card);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border-color);
        padding: 1.4rem;
        border-radius: var(--radius-md);
        display: flex;
        flex-direction: column;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }

      .stat-number {
        font-size: 2.2rem;
        font-weight: 900;
        color: var(--accent);
      }

      .stat-label {
        font-size: 0.88rem;
        color: var(--text-muted);
        margin-top: 0.2rem;
      }

      .floating-showcase {
        position: relative;
        background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
        border: 1px solid rgba(56, 189, 248, 0.3);
        border-radius: var(--radius-lg);
        padding: 3.5rem 2.2rem;
        text-align: center;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
      }

      .showcase-emoji {
        font-size: 5.5rem;
        margin-bottom: 1rem;
      }

      .showcase-badge {
        position: absolute;
        background: #1e293b;
        border: 1px solid rgba(56, 189, 248, 0.4);
        padding: 0.55rem 1.2rem;
        border-radius: 999px;
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--accent);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      }

      .badge-top { top: -16px; right: 24px; }
      .badge-bottom { bottom: -16px; left: 24px; }

      .features-section { margin-top: 4.5rem; }
      .section-title { text-align: center; font-size: 2.2rem; font-weight: 900; margin-bottom: 2.2rem; }
      .features-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
        gap: 1.5rem;
      }

      .feature-card {
        background: var(--bg-card);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border-color);
        padding: 2.2rem;
        border-radius: var(--radius-lg);
        transition: transform 0.25s ease, border-color 0.25s ease;
      }

      .feature-card:hover {
        transform: translateY(-5px);
        border-color: rgba(56, 189, 248, 0.4);
      }

      .feature-icon { font-size: 2.8rem; margin-bottom: 1rem; }

      /* Explorer Page */
      .explorer-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        flex-wrap: wrap;
        gap: 1.2rem;
        margin-bottom: 2rem;
      }

      .search-input {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        padding: 0.85rem 1.2rem;
        border-radius: 999px;
        width: 320px;
        font-family: inherit;
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.2s;
      }

      .search-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
      }

      .tabs-bar {
        display: flex;
        gap: 0.85rem;
        overflow-x: auto;
        padding-bottom: 0.75rem;
        margin-bottom: 1.2rem;
      }

      .tab-btn {
        background: var(--bg-card);
        color: var(--text-muted);
        border: 1px solid var(--border-color);
        padding: 0.9rem 1.4rem;
        border-radius: var(--radius-md);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.65rem;
        font-family: inherit;
        font-size: 0.98rem;
        font-weight: 700;
        white-space: nowrap;
        transition: all 0.2s ease;
      }

      .tab-btn:hover {
        background: var(--bg-card-hover);
        color: var(--text-main);
        transform: translateY(-2px);
      }

      .tab-btn.active {
        background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
        color: #0b1120;
        border-color: transparent;
        font-weight: 800;
        box-shadow: 0 8px 20px rgba(56, 189, 248, 0.35);
      }

      .tab-count {
        background: rgba(0, 0, 0, 0.25);
        padding: 0.15rem 0.6rem;
        border-radius: 999px;
        font-size: 0.8rem;
      }

      .tab-banner {
        background: rgba(56, 189, 248, 0.1);
        border-right: 4px solid var(--accent);
        padding: 0.9rem 1.25rem;
        border-radius: 10px;
        margin-bottom: 1.75rem;
        color: #e2e8f0;
        font-weight: 500;
      }

      .breeds-selector-section {
        background: var(--bg-card);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border-color);
        padding: 1.75rem;
        border-radius: var(--radius-lg);
        margin-bottom: 1.75rem;
      }

      .selector-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
        margin-bottom: 1.25rem;
      }

      .breed-Quick-nav {
        display: flex;
        align-items: center;
        gap: 0.85rem;
      }

      .btn-nav-step {
        background: #0f172a;
        color: var(--text-main);
        border: 1px solid var(--border-color);
        padding: 0.5rem 1.1rem;
        border-radius: 999px;
        cursor: pointer;
        font-family: inherit;
        font-weight: 600;
        transition: all 0.2s;
      }

      .btn-nav-step:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
      }

      .btn-nav-step:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      .breed-pills-container {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        max-height: 220px;
        overflow-y: auto;
        padding: 0.25rem;
      }

      .breed-pill {
        background: #0f172a;
        color: var(--text-main);
        border: 1px solid var(--border-color);
        padding: 0.5rem 1.1rem;
        border-radius: 999px;
        cursor: pointer;
        font-family: inherit;
        font-weight: 600;
        text-transform: capitalize;
        display: flex;
        align-items: center;
        gap: 0.45rem;
        transition: all 0.18s ease;
      }

      .breed-pill:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
      }

      .breed-pill.selected {
        background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
        color: #0b1120;
        font-weight: 800;
        border-color: transparent;
        box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
      }

      .sub-badge {
        font-size: 0.72rem;
        background: rgba(255, 255, 255, 0.18);
        padding: 0.05rem 0.45rem;
        border-radius: 999px;
      }

      .subbreeds-section {
        background: rgba(129, 140, 248, 0.12);
        border: 1px solid rgba(129, 140, 248, 0.35);
        padding: 1.25rem 1.5rem;
        border-radius: var(--radius-md);
        margin-bottom: 1.75rem;
      }

      .subbreed-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        margin-top: 0.85rem;
      }

      .sub-pill {
        background: #0f172a;
        color: var(--text-main);
        border: 1px solid var(--border-color);
        padding: 0.45rem 1rem;
        border-radius: 999px;
        cursor: pointer;
        text-transform: capitalize;
        font-family: inherit;
        font-weight: 600;
        transition: all 0.2s;
      }

      .sub-pill.active {
        background: var(--accent-secondary);
        color: #0b1120;
        font-weight: 800;
      }

      .gallery-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
      }

      .selected-breed-title {
        font-size: 1.8rem;
        font-weight: 900;
        color: var(--accent);
      }

      .images-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 1.4rem;
      }

      .image-card {
        position: relative;
        height: 260px;
        border-radius: var(--radius-lg);
        overflow: hidden;
        cursor: pointer;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      }

      .image-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.35s ease;
      }

      .image-card:hover img {
        transform: scale(1.08);
      }

      .image-card-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(11, 17, 32, 0.85), rgba(11, 17, 32, 0.2));
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 1.5rem;
        opacity: 0;
        transition: opacity 0.25s ease;
        font-weight: 800;
        font-size: 1.05rem;
      }

      .image-card:hover .image-card-overlay {
        opacity: 1;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 200;
        padding: 1.5rem;
      }

      .modal-card {
        background: #1e293b;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        max-width: 750px;
        width: 100%;
        overflow: hidden;
        position: relative;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      }

      .modal-image {
        width: 100%;
        max-height: 72vh;
        object-fit: contain;
        background: #090d16;
      }

      .modal-footer {
        padding: 1.2rem 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .modal-close-btn {
        position: absolute;
        top: 14px;
        left: 14px;
        background: rgba(15, 23, 42, 0.85);
        color: #fff;
        border: 1px solid var(--border-color);
        width: 40px;
        height: 40px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 1.1rem;
      }

      .status-box { text-align: center; padding: 4rem 1rem; font-size: 1.2rem; }
      .app-footer {
        text-align: center;
        padding: 1.75rem;
        color: var(--text-muted);
        border-top: 1px solid var(--border-color);
        margin-top: 4rem;
      }

      @media (max-width: 768px) {
        .hero-section { grid-template-columns: 1fr; }
        .hero-title { font-size: 2.3rem; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
